name: CI
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Postgres for the database (RLS) and auth (sessions/tenancy) suites.
      # Matches the packages/database README one-liner and support defaults;
      # DATABASE_URL is set explicitly so an unreachable container fails
      # loudly instead of silently skipping the suites.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resolveops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resolveops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  pester:
    name: Pester fixture suite (pwsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fixture-only Pester suite (per docs/DIAGNOSTIC-RUNBOOK.md)
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Exit = $true
          $cfg.Run.Path = "scripts/Get-BitLockerDiagnostic.Tests.ps1"
          $cfg.Output.Verbosity = "Detailed"
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputFormat = "NUnitXml"
          $cfg.TestResult.OutputPath = "pester-results.xml"
          Invoke-Pester -Configuration $cfg
      - name: Upload Pester test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-test-results
          path: pester-results.xml
